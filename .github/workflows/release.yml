name: Release

# Publishes a GitHub Release with the APK attached when a version tag is pushed, for example:
#   git tag v1.1 && git push origin v1.1
# The app's Settings > "Check for updates" looks at the newest release created this way.

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      # The tag v1.2 becomes versionName 1.2; the run number gives Android an ever-increasing versionCode
      - name: Build Release APK
        run: gradle :app:assembleRelease -PversionName="${GITHUB_REF_NAME#v}" -PversionCode="${GITHUB_RUN_NUMBER}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Network-Firewall-${GITHUB_REF_NAME}.apk"
          gh release create "${GITHUB_REF_NAME}" "Network-Firewall-${GITHUB_REF_NAME}.apk" \
            --title "${GITHUB_REF_NAME}" --generate-notes
